<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C23" />
      <stop offset="100%" stop-color="#0B0C10" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B7131A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Square Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="4"/>

  <!-- CPU Chip Frame -->
  <rect x="128" y="128" width="256" height="256" rx="36" fill="url(#brandGrad)" shadow="0 10px 30px rgba(183,19,26,0.5)"/>

  <!-- Gold/Circuit Pins -->
  <rect x="192" y="96" width="24" height="32" rx="6" fill="#F59E0B"/>
  <rect x="244" y="96" width="24" height="32" rx="6" fill="#F59E0B"/>
  <rect x="296" y="96" width="24" height="32" rx="6" fill="#F59E0B"/>

  <rect x="192" y="384" width="24" height="32" rx="6" fill="#F59E0B"/>
  <rect x="244" y="384" width="24" height="32" rx="6" fill="#F59E0B"/>
  <rect x="296" y="384" width="24" height="32" rx="6" fill="#F59E0B"/>

  <rect x="96" y="192" width="32" height="24" rx="6" fill="#F59E0B"/>
  <rect x="96" y="244" width="32" height="24" rx="6" fill="#F59E0B"/>
  <rect x="96" y="296" width="32" height="24" rx="6" fill="#F59E0B"/>

  <rect x="384" y="192" width="32" height="24" rx="6" fill="#F59E0B"/>
  <rect x="384" y="244" width="32" height="24" rx="6" fill="#F59E0B"/>
  <rect x="384" y="296" width="32" height="24" rx="6" fill="#F59E0B"/>

  <!-- Inner Chip Core -->
  <rect x="168" y="168" width="176" height="176" rx="20" fill="#0B0C10"/>

  <!-- Lightning / Power / PC Emblem inside CPU Core -->
  <path d="M 270 196 L 220 268 L 256 268 L 242 316 L 292 244 L 256 244 Z" fill="url(#accentGrad)"/>
</svg>
